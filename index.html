// Compact step descriptor for pills: "+1 boar", "3 wood->build", etc.
function stepDesc(s) {
  if (s.vill) return "+1 " + LOC[s.to].label.toLowerCase();
  if (s.move) return s.move + " " + LOC[s.from].label.toLowerCase() + "->" + LOC[s.to].label.toLowerCase();
  return s.action;
}
// Total villager count AFTER the step at index idx (3 starting vills)
function villCount(steps, idx) {
  let n = 3;
  for (let k = 0; k <= idx; k++) if (steps[k].vill) n++;
  return n;
}

// Civ crest icons (aoe2techtree assets, local files). Keys are single-word civ names.
const CIV_ICON = (civ) => "icons/civs/" + civ.toLowerCase() + ".png";
// Base-game civs (no paid DLC required) vs all civs (enemy AI can pick any).
const BASE_CIV_LIST = Object.keys(CIVS).filter((c) => !CIVS[c].dlc).sort();
const ALL_CIV_LIST = Object.keys(CIVS).sort();

function CivBadge({ side, value, active, onOpen }) {
  const civ = value ? CIVS[value] : null;
  const color = side === "enemy" ? "#c05a5a" : "#4a90d9";
  const label = side === "me" ? "Me" : side === "ally" ? "🛡 Ally" : "⚔ Enemy";
  return (
    <div className="flex flex-col items-center gap-1">
      <button onClick={onOpen}
        className="civ-badge flex items-center gap-1.5 rounded-lg border px-2 py-1.5 text-sm font-bold"
        style={{
          borderColor: color + "aa",
          backgroundColor: active ? color + "33" : "#241b10",
          color: "#f3e8cf", minWidth: 96, minHeight: 34,
        }}>
        {civ
          ? <img src={CIV_ICON(value)} alt="" style={{ width: 22, height: 22, objectFit: "contain" }} />
          : <span className="text-xs" style={{ color }}>{label}</span>}
        {civ && <span className="max-w-[110px] truncate">{value}</span>}
        <span className="text-[10px] opacity-60">▾</span>
      </button>
      {civ && (
        <div className="rounded-lg border px-2 py-1 text-[11px] leading-snug"
          style={{ borderColor: color + "88", backgroundColor: "#1d1610", maxWidth: 170 }}>
          <div className="font-bold" style={{ color }}>{value}</div>
          <div>• Style: <span className="text-amber-100/80">{civ.tag}</span></div>
          <div>• Eco: <span className="text-amber-100/80">{civ.eco}</span></div>
          <div>• Mil: <span className="text-amber-100/80">{civ.mil}</span></div>
        </div>
      )}
    </div>
  );
}

// Civ picker as a MODAL OVERLAY: compact 4-column tile grid (tiles ~66px = 50% above the
// 44px minimum touch target standard), solid opaque colors, scrollable, tap backdrop to cancel.
function CivPicker({ color, civs, value, extra, onSelect }) {
  const tile = (selected) => ({
    backgroundColor: selected ? color : "#241b10",
    border: "1px solid " + (selected ? color : "#3a2e1c"),
    color: selected ? "#14100a" : "#f3e8cf",
    minHeight: 66,
  });
  return (
    <div onClick={() => onSelect(null)}
      style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "rgba(10,8,5,0.75)" }}>
      <div onClick={(e) => e.stopPropagation()}
        style={{ display: "grid", gridTemplateColumns: "repeat(4, 68px)", gap: 6, padding: 8, backgroundColor: "#1a1410", border: "2px solid " + color, borderRadius: 16, maxHeight: "76vh", overflowY: "auto", boxShadow: "0 8px 32px rgba(0,0,0,0.8)" }}>
        {extra && extra.map((x) => (
          <button key={String(x.value)} onClick={() => onSelect(x.value)}
            className="civ-tile flex flex-col items-center justify-center rounded-lg px-1 py-1"
            style={tile(String(x.value) === String(value))}>
            <span style={{ fontSize: 18, lineHeight: "22px" }}>{x.icon || ""}</span>
            <span className="max-w-full truncate" style={{ fontSize: 10, fontWeight: "bold" }}>{x.label}</span>
          </button>
        ))}
        {civs.map((c) => (
          <button key={c} onClick={() => onSelect(c)}
            className="civ-tile flex flex-col items-center justify-center rounded-lg px-1 py-1"
            style={tile(c === value)}>
            <img src={CIV_ICON(c)} alt={c} style={{ width: 22, height: 22, objectFit: "contain" }} />
            <span className="max-w-full truncate" style={{ fontSize: 10, fontWeight: "bold" }}>{c}</span>
          </button>
        ))}
        <button onClick={() => onSelect("")}
          className="civ-tile flex flex-col items-center justify-center rounded-lg px-1 py-1"
          style={tile(false)}>
          <span style={{ fontSize: 18, lineHeight: "22px" }}>✕</span>
          <span style={{ fontSize: 10, fontWeight: "bold" }}>Clear</span>
        </button>
      </div>
    </div>
  );
}

// Ordinal suffix helper: 1st, 2nd, 3rd, 4th …
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");

function StepMini({ s, size, opacity, timeSize, accent }) {
  const dest = s.to ? LOC[s.to] : null;
  const src = s.from ? LOC[s.from] : null;
  // Mirrors the current-step card skeleton: icon over time on the left, action line + note on the right.
  return (
    <div style={{ opacity }} className="flex min-w-[150px] flex-1 items-center gap-2 text-left">
      <div className="flex shrink-0 flex-col items-center gap-0.5">
        {s.vill && <Icon kind="villager" size={size} />}
        {s.move && <Icon kind={src.icon} size={size} />}
        {s.action && <Icon kind={s.iconHint || "house"} size={size} />}
        <span className="font-mono font-bold leading-none" style={{ fontSize: timeSize, color: accent }}>{s.t}</span>
      </div>
      <div className="flex flex-col gap-0.5">
        {s.vill && (
          <div className="flex items-center gap-1 font-bold text-amber-100" style={{ fontSize: timeSize + 3 }}>
            <span>{ord(s.vill + 3)} villager</span>
            <span style={{ color: accent }}>➜</span>
            <Icon kind={dest.icon} size={Math.round(size * 0.8)} />
            <span>{dest.label}</span>
          </div>
        )}
        {s.move && (
          <div className="flex items-center gap-1 font-bold text-amber-100" style={{ fontSize: timeSize + 3 }}>
            <Icon kind={src.icon} size={Math.round(size * 0.8)} />
            <span>×{s.move}</span>
            <span style={{ color: accent }}>➜</span>
            <Icon kind={dest.icon} size={Math.round(size * 0.8)} />
            <span>{dest.label}</span>
          </div>
        )}
        {s.action && (
          <div className="font-semibold" style={{ fontSize: timeSize + 2, color: accent }}>
            {s.action.length > 24 ? s.action.slice(0, 23) + "…" : s.action}
          </div>
        )}
        {s.note && (
          <div style={{ fontSize: timeSize, color: "rgba(243,232,207,0.75)" }}>
            {s.note.length > 28 ? s.note.slice(0, 27) + "…" : s.note}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [boId, setBoId] = useState("scouts");
  const [myCiv, setMyCiv] = useState("Spanish");
  const [civsOpen, setCivsOpen] = useState(false);
  const [picker, setPicker] = useState(null); // "me" | "ally:N" | "enemy:N" | "pc" | null
  // Dynamic filter rows: setting the last slot appends a fresh empty one; clearing prunes empties (one trailing empty kept)
  const setCivAt = (arr, setArr, k, v) => {
    const next = arr.map((x, j) => (j === k ? v : x));
    if (v && k === arr.length - 1) next.push("");
    const pruned = next.filter(Boolean);
    setArr(pruned.length ? [...pruned, ""] : [""]);
  };
  const [allies, setAllies] = useState(["Britons", ""]);
  const [enemies, setEnemies] = useState([""]);
  const [i, setI] = useState(0);
  // Production calculator state
  const [pcOpen, setPcOpen] = useState(false);
  const [pcAge, setPcAge] = useState("feudal");
  const [pcSel, setPcSel] = useState({ villager: 1 }); // unitId -> building count (villager = TC count; 1 TC by default)
  const bo = useMemo(() => BUILD_ORDERS.find((b) => b.id === boId), [boId]);
  const steps = bo.steps;
  const step = steps[i];

  // Assignment replay
  const assign = useMemo(() => {
    const a = { sheep: 3 };
    for (let k = 0; k < i; k++) {
      const s = steps[k];
      if (s.vill) a[s.to] = (a[s.to] || 0) + 1;
      if (s.move) {
        a[s.from] = Math.max(0, (a[s.from] || 0) - s.move); a[s.to] = (a[s.to] || 0) + s.move;
        // House builds are one-time tasks: by the next step the villager is back gathering.
        if (s.back) { a[s.to] = Math.max(0, a[s.to] - s.move); a[s.back] = (a[s.back] || 0) + s.move; }
      }
    }
    return a;
  }, [boId, i]);

  const next = useCallback(() => setI((v) => Math.min(v + 1, steps.length - 1)), [steps.length]);
  const prev = useCallback(() => setI((v) => Math.max(v - 1, 0)), []);
  useEffect(() => {
    const h = (e) => {
      if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") prev();
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [next, prev]);

  const rates = useMemo(() => {
    const r = { food: 0, wood: 0, gold: 0, stone: 0 };
    for (const [loc, n] of Object.entries(assign)) if (LOC[loc].res !== "none") r[LOC[loc].res] += (RATES_MIN[loc] || 0) * n;
    return r;
  }, [assign]);
  const vills = Object.values(assign).reduce((a, b) => a + b, 0);

  // ---- Production calculator derived values ----
  const pcCivName = myCiv || ""; // calculator always follows the civ panel's Me civ ("" = generic rates)
  const pcTotals = useMemo(() => {
    const ageRates = { ...GATHER[pcAge], ...((CIV_ECO[pcCivName] || {})[pcAge] || {}) };
    const rate = (res) => ageRates[res];
    const totals = { food: 0, wood: 0, gold: 0 };
    for (const [id, n] of Object.entries(pcSel)) {
      if (!n || !ALL_UNITS[id]) continue;
      const u = UNITS[id];
      // per-civ unit variants (cost discounts per age, train-speed multipliers)
      const mod = (u.civMod || {})[pcCivName] || null;
      let t = u.t;
      const cost = { ...u.cost };
      if (mod) {
        const tt = typeof mod.train === "number" ? mod.train : ((mod.train && mod.train[pcAge]) || 1);
        if (tt && tt !== 1) t = t / tt;
        if (mod.disc) {
          const d = typeof mod.disc === "number" ? mod.disc : (mod.disc[pcAge] || 0);
          for (const r of (mod.res || Object.keys(cost))) if (cost[r] != null) cost[r] = cost[r] * (1 - d);
        }
      }
      let speed = pcAge === "imperial" && u.bld !== "towncenter" && u.bld !== "siege" ? CONSCRIPTION : 1;
      // Team bonuses derived from the civ panel: own civ + allies (non-stacking)
      const teamCivs = new Set([myCiv, ...allies].filter(Boolean));
      for (const a of teamCivs) { const tb = TEAM_BONUS[a]; if (tb && tb.bld === u.bld) speed *= tb.mult; }
      for (const [res, c] of Object.entries(cost)) {
        totals[res] += (n * c / t) * speed / rate(res);
      }
    }
    return totals;
  }, [pcSel, pcAge, pcCivName, myCiv, allies.join(",")]);

  // Time helpers + minute ruler marks (positions derived from the step times in the pills)
  const tSec = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const minuteMarks = useMemo(() => {
    const total = tSec(steps[steps.length - 1].t);
    const marks = [];
    for (let m = 1; m * 60 <= total; m++) {
      const tt = m * 60;
      let k = steps.length - 1;
      for (let j = 0; j < steps.length - 1; j++) {
        if (tSec(steps[j].t) <= tt && tt <= tSec(steps[j + 1].t)) { k = j; break; }
      }
      const span = tSec(steps[Math.min(k + 1, steps.length - 1)].t) - tSec(steps[k].t);
      const frac = span > 0 ? (tt - tSec(steps[k].t)) / span : 0;
      marks.push({ m, pct: ((k + Math.min(frac, 1)) / steps.length) * 100 });
    }
    return marks;
  }, [boId]);

  const prev2 = steps[i - 2], prev1 = steps[i - 1], next1 = steps[i + 1], next2 = steps[i + 2];

  // Arrow-indicator geometry (fractions of board width, 8 columns)
  const colCenter = (loc) => (COLS.indexOf(loc) + 0.5) / COLS.length;
  const moveL = step.move ? Math.min(colCenter(step.from), colCenter(step.to)) : 0;
  const moveW = step.move ? Math.abs(colCenter(step.to) - colCenter(step.from)) : 0;
  const moveFwd = step.move ? colCenter(step.to) > colCenter(step.from) : true;

  return (
    <div className="flex min-h-screen flex-col gap-2 p-2 sm:p-4" style={{ backgroundColor: "#14100a", color: "#f3e8cf", fontFamily: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif" }}>
      <style>{`.civ-badge:hover { filter: brightness(1.35); }
.civ-badge:active { filter: brightness(0.85); }
.civ-tile:hover { filter: brightness(1.35); border-color: rgba(243,232,207,0.45) !important; }
.civ-tile:active { filter: brightness(0.85); }
*, *::before, *::after { box-sizing: border-box; }
.pc-header:hover { filter: brightness(1.3); }
.pills-scroll::-webkit-scrollbar, .ctx-scroll::-webkit-scrollbar { display: none; }
.pills-scroll, .ctx-scroll { scrollbar-width: none; -ms-overflow-style: none; }`}</style>
      {/* Build tabs — vill/pop counter left-aligned */}
      <div className="flex flex-wrap items-center gap-2">
        <div className="rounded-lg bg-black/40 px-4 py-1.5 text-lg font-semibold tabular-nums text-amber-200">
          👥 {vills} vills
        </div>
        {BUILD_ORDERS.map((b) => (
          <button key={b.id} onClick={() => { setBoId(b.id); setI(0); }}
            className="rounded-lg px-4 py-1.5 text-lg font-bold transition-all"
            style={{ backgroundColor: boId === b.id ? b.accent : "#241b10", color: boId === b.id ? "#14100a" : "#cbb98e" }}>
            {b.name}
          </button>
        ))}
        <span className="ml-auto self-center px-1 font-mono text-[10px] text-amber-100/35">v{APP_VERSION}</span>
      </div>

      {/* PERSISTENT LOCATION BOARD */}
      <div className="grid grid-cols-4 gap-1.5 rounded-2xl border border-amber-900/60 bg-black/40 p-1.5 sm:grid-cols-8 sm:gap-2 sm:p-2">
        {COLS.map((loc) => {
          const L = LOC[loc];
          const n = assign[loc] || 0;
          const hot = (step.vill && step.to === loc) || (step.move && step.to === loc);
          const cold = step.move && step.from === loc;
          const HL = { food: "#b04040", wood: "#3f7a3f", gold: "#9a7a20", stone: "#5a6470" }[loc] || bo.accent;
          const shown = Math.min(n, 10);
          const rest = n - 10;
          // Only the dots representing the moved villagers animate (e.g. 1 of 10), not the whole column.
          const moveN = step.move && (step.to === loc || step.from === loc) ? Math.max(1, Math.min(step.move, shown)) : 0;
          return (
            <motion.div key={loc}
              animate={{ scale: hot ? [1, 1.06, 1] : 1, opacity: n === 0 && !hot ? 0.35 : 1 }}
              transition={{ duration: 0.5 }}
              className="flex flex-col items-center rounded-xl border-2 px-1 py-1.5"
              style={{
                borderColor: hot || cold ? HL : L.color + "55",
                backgroundColor: hot ? HL + "38" : cold ? HL + "20" : "rgba(0,0,0,0.3)",
              }}>
              <Icon kind={L.icon} size={38} />
              <span className="text-2xl font-semibold leading-tight tabular-nums" style={{ color: n > 0 ? L.color : "#5a5142" }}>{n}</span>
              <div className="flex max-w-full flex-wrap justify-center" style={{ rowGap: 2, minHeight: 8 }}>
                <div className="flex justify-center" style={{ columnGap: 2 }}>
                  {Array.from({ length: Math.min(shown, 5) }).map((_, k) => {
                    const moving = moveN > 0 && k >= shown - moveN;
                    return (
                    <motion.span key={k}
                      animate={moving ? { scale: [1, 1.5, 1], opacity: [1, 0.6, 1] } : { scale: 1, opacity: 1 }}
                      transition={moving ? { repeat: Infinity, duration: 0.9, delay: (k - (shown - moveN)) * 0.06 } : { duration: 0.2 }}
                      className="h-2 w-2 rounded-full"
                      style={{ backgroundColor: L.color, boxShadow: moving ? `0 0 6px ${L.color}` : "none" }} />
                    );
                  })}
                </div>
                {shown > 5 && (
                  <div className="flex justify-center" style={{ marginLeft: 5, columnGap: 2 }}>
                    {Array.from({ length: shown - 5 }).map((_, k) => {
                      const moving = moveN > 0 && (k + 5) >= shown - moveN;
                      return (
                      <motion.span key={k + 5}
                        animate={moving ? { scale: [1, 1.5, 1], opacity: [1, 0.6, 1] } : { scale: 1, opacity: 1 }}
                        transition={moving ? { repeat: Infinity, duration: 0.9, delay: (k + 5 - (shown - moveN)) * 0.06 } : { duration: 0.2 }}
                        className="h-2 w-2 rounded-full"
                        style={{ backgroundColor: L.color, boxShadow: moving ? `0 0 6px ${L.color}` : "none" }} />
                      );
                    })}
                  </div>
                )}
                {rest > 0 && <span className="text-[9px] leading-3" style={{ color: L.color }}>+{rest}</span>}
              </div>
              <span className="text-[10px] uppercase tracking-wide text-amber-100/40">{L.label}</span>
            </motion.div>
          );
        })}
      </div>

      {/* ARROW INDICATOR ROW — below the board, aligned to its columns */}
      <div className="relative h-12 rounded-xl bg-black/30" style={{ marginTop: -6 }}>
        {step.vill && (
          <div className="absolute flex flex-col items-center"
            style={{ left: `${colCenter(step.to) * 100}%`, transform: "translateX(-50%)", bottom: 2, top: 0 }}>
            <div className="flex flex-col items-center">
              <span className="text-sm font-bold" style={{ color: bo.accent }}>+{ord(step.vill + 3)} villager</span>
              <motion.span animate={{ y: [4, -2, 4], opacity: [0.6, 1, 0.6] }}
                transition={{ repeat: Infinity, duration: 0.9 }}
                className="text-3xl leading-none" style={{ color: bo.accent }}>▲</motion.span>
            </div>
          </div>
        )}
        {step.move && (
          <div className="absolute" style={{ left: `${moveL * 100}%`, width: `${moveW * 100}%`, top: 6, bottom: 6 }}>
            <svg width="100%" height="100%" viewBox="0 0 100 40" preserveAspectRatio="none">
              <defs>
                <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0 0 L6 3 L0 6 Z" fill={bo.accent} />
                </marker>
              </defs>
              <line x1={moveFwd ? 2 : 98} y1="20" x2={moveFwd ? 92 : 8} y2="20"
                stroke={bo.accent} strokeWidth="2.5" markerEnd="url(#ah)" />
            </svg>
            <div className="absolute flex w-full justify-center gap-1" style={{ top: 2 }}>
              {Array.from({ length: step.move }).map((_, k) => (
                <motion.span key={k}
                  animate={{ x: moveFwd ? [0, 12] : [0, -12], opacity: [1, 1] }}
                  transition={{ repeat: Infinity, duration: 0.9, delay: k * 0.12, repeatType: "reverse" }}
                  className="h-3 w-3 rounded-full"
                  style={{ backgroundColor: LOC[step.from].color, boxShadow: `0 0 8px ${LOC[step.from].color}` }} />
              ))}
              <span className="ml-1 text-sm font-bold" style={{ color: bo.accent }}>{step.move} vills move</span>
            </div>
          </div>
        )}
        {!step.vill && !step.move && (
          <div className="absolute inset-0 flex items-center justify-center text-lg font-bold text-amber-100/40">
            🛠️ {step.action}
          </div>
        )}
      </div>

      {/* PERSISTENT RATES STRIP (per minute) */}
      {/* Rates strip: villager count left of label, icon top, number left-aligned & fixed-width (no layout shift 9→10) */}
      <div className="flex flex-wrap items-start gap-6 rounded-xl bg-black/35 px-4 py-1.5">
        {[["food", "food"], ["wood", "woodres"], ["gold", "goldres"], ["stone", "stoneres"]].map(([res, ico]) => {
          const gatherers = Object.entries(assign).reduce((n, [loc, cnt]) => (LOC[loc].res === res ? n + cnt : n), 0);
          return (
            <span key={res} className="flex flex-col items-center leading-tight">
              <Icon kind={ico} size={26} />
              <span className="flex items-center gap-1 text-[10px] uppercase tracking-wide">
                <span className="font-bold text-amber-200/80">{gatherers}</span>
                <span className="text-amber-100/40">{res}</span>
              </span>
              <span className="flex w-[74px] items-baseline justify-start text-[22px] font-semibold tabular-nums" style={{ color: RES_C[res], fontVariantNumeric: "tabular-nums" }}>
                {rates[res].toFixed(1)}<span className="text-sm font-medium opacity-40">/m</span>
              </span>
            </span>
          );
        })}
      </div>

      {/* Faint minute ruler across the main display — unobtrusive, fading out toward both screen edges */}
      <div className="relative h-2.5" style={{ maskImage: "linear-gradient(90deg, transparent 0%, black 18%, black 82%, transparent 100%)", WebkitMaskImage: "linear-gradient(90deg, transparent 0%, black 18%, black 82%, transparent 100%)" }}>
        <div className="absolute left-0 right-0" style={{ top: "50%", height: 1, backgroundColor: "rgba(74,144,217,0.30)" }} />
        {minuteMarks.map(({ pct }) => (
          <span key={pct} className="absolute rounded-full" style={{ left: pct + "%", top: "50%", transform: "translate(-50%, -50%)", width: 3, height: 3, backgroundColor: "rgba(74,144,217,0.45)" }} />
        ))}
      </div>

      {/* CONTEXT ROW: 2 prev — current — 2 next (always one horizontal row; next1 sits directly at place 1) */}
      <div className="ctx-scroll flex flex-row items-stretch gap-3 overflow-x-auto">
        <div className="flex flex-1 items-center justify-end gap-3">
          {prev2 && <StepMini s={prev2} size={24} opacity={0.3} timeSize={12} accent={bo.accent} />}
          {prev1 && <StepMini s={prev1} size={30} opacity={0.55} timeSize={13} accent={bo.accent} />}
        </div>

        {/* Current step — compact card (no transition animation; instant swap to keep info visible) */}
        <div key={boId + i}
            className="flex w-[38%] min-w-[220px] shrink-0 flex-col items-center gap-2 rounded-2xl border-2 px-2 py-2 sm:flex-row sm:gap-4 sm:px-4 sm:py-2.5"
            style={{ borderColor: bo.accent, backgroundColor: "rgba(0,0,0,0.55)" }}>
            <div className="flex flex-col items-center">
              {step.vill && <Icon kind="villager" size={42} />}
              {step.move && <Icon kind={LOC[step.from].icon} size={36} />}
              {step.action && <Icon kind="house" size={38} />}
              <span className="font-mono text-lg font-bold" style={{ color: bo.accent }}>{step.t}</span>
            </div>
            <div>
              {step.vill && (
                <div className="flex items-center gap-2 text-2xl font-bold">
                  <span>{ord(step.vill + 3)} villager</span>
                  <motion.span animate={{ x: [0, 8, 0] }} transition={{ repeat: Infinity, duration: 1 }} style={{ color: bo.accent }}>➜</motion.span>
                  <Icon kind={LOC[step.to].icon} size={30} />
                  <span>{LOC[step.to].label}</span>
                </div>
              )}
              {step.move && (
                <div className="flex items-center gap-2 text-2xl font-bold">
                  <Icon kind={LOC[step.from].icon} size={30} />
                  <span>×{step.move}</span>
                  <motion.span animate={{ x: [0, 10, 0] }} transition={{ repeat: Infinity, duration: 0.9 }} style={{ color: bo.accent }}>➜</motion.span>
                  <Icon kind={LOC[step.to].icon} size={30} />
                  <span>{LOC[step.to].label}</span>
                </div>
              )}
              {step.action && <div className="text-2xl font-bold" style={{ color: bo.accent }}>{step.action}</div>}
              <div className="text-base text-amber-100/70">{step.note || ""}</div>
            </div>
          </div>

        <div className="flex flex-1 items-center justify-start gap-3">
          {next1 && <StepMini s={next1} size={30} opacity={0.55} timeSize={13} accent={bo.accent} />}
          {next2 && <StepMini s={next2} size={24} opacity={0.3} timeSize={12} accent={bo.accent} />}
        </div>
      </div>

      {/* PRODUCTION CALCULATOR — expanding panel */}
      <div className="rounded-xl border border-amber-900/50 bg-black/30">
        <button onClick={() => setPcOpen(!pcOpen)}
          className="pc-header flex items-center gap-2 rounded-lg px-4 py-1.5 text-sm font-semibold text-amber-200"
          style={{ backgroundColor: "#241b10", border: "1px solid #3a2e1c", minHeight: 34 }}>
          <span>⚒ Production calculator — vills for constant production</span>
          <span>{pcOpen ? "▲" : "▼"}</span>
        </button>
        {pcOpen && (
          <div className="flex flex-col gap-2 px-4 pb-3 pt-1">
            {/* Age selection; civ comes from the civ panel's "Me" (team bonuses derived from Me + allies) */}
            <div className="flex flex-wrap items-center gap-2 text-sm">
              {AGE_KEYS.map((a) => (
                <button key={a} onClick={() => setPcAge(a)}
                  className="rounded-lg px-2.5 py-1 text-xs font-semibold transition-all"
                  style={{ backgroundColor: pcAge === a ? bo.accent : "#241b10", color: pcAge === a ? "#14100a" : "#cbb98e" }}>
                  {AGE_LABEL[a]}
                </button>
              ))}
            </div>
            {/* Unit selection grid */}
            <div className="flex flex-wrap gap-1.5">
              {Object.entries(ALL_UNITS)
                .filter(([id, u]) => AGE_KEYS.indexOf(u.age) <= AGE_KEYS.indexOf(pcAge))
                .filter(([id, u]) => u.only ? u.only.includes(pcCivName) : !(u.excl || []).includes(pcCivName))
                .sort((a, b) => UNIT_PRIO({ ...a[1], id: a[0] }) - UNIT_PRIO({ ...b[1], id: b[0] }))
                .map(([id, u]) => {
                const sel = pcSel[id] || 0;
                return (
                  <button key={id} onClick={() => setPcSel((s) => ({ ...s, [id]: sel ? 0 : 1 }))}
                    className="flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs transition-all"
                    style={{
                      backgroundColor: sel ? bo.accent + "33" : "#1d1610",
                      border: "1px solid " + (sel ? bo.accent : "#3a2e1c"),
                      color: sel ? "#f3e8cf" : "#9a8a68", textDecoration: (u.excl || []).includes(pcCivName) ? "line-through" : "none",
                    }}
                    title={(u.excl || []).includes(pcCivName) ? "Not available for " + pcCivName : u.label + " — " + Object.entries(u.cost).map(([r, v]) => v + " " + r).join(", ") + ", " + u.t + "s"}>
                    {u.icon ? <Icon kind={u.icon} size={18} /> : <span>{u.emoji}</span>}<span>{u.label}</span>
                  </button>
                );
              })}
            </div>
            {/* Building counts + totals */}
            {Object.entries(pcSel).filter(([, n]) => n > 0).length > 0 && (
              <div className="flex flex-col gap-2">
                <div className="flex flex-wrap gap-2">
                  {Object.entries(pcSel).filter(([, n]) => n > 0).map(([id, n]) => (
                    <span key={id} className="flex items-center gap-1.5 rounded-lg bg-black/40 px-2 py-1 text-xs text-amber-100">
                      {ALL_UNITS[id].icon ? <Icon kind={ALL_UNITS[id].icon} size={16} /> : <span>{ALL_UNITS[id].emoji}</span>}
                      <span className="flex items-center gap-0.5">
                        <button onClick={() => setPcSel((st) => ({ ...st, [id]: Math.max(1, n - 1) }))}
                          className="rounded px-1.5 font-bold" title="Fewer buildings"
                          style={{ backgroundColor: "#241b10", color: "#f3e8cf", border: "1px solid #3a2e1c", minHeight: 28, minWidth: 28 }}>−</button>
                        <span className="px-0.5 text-center tabular-nums" style={{ minWidth: 24 }}>{n}×</span>
                        <button onClick={() => setPcSel((st) => ({ ...st, [id]: Math.min(6, n + 1) }))}
                          className="rounded px-1.5 font-bold" title="More buildings"
                          style={{ backgroundColor: "#241b10", color: "#f3e8cf", border: "1px solid #3a2e1c", minHeight: 28, minWidth: 28 }}>+</button>
                      </span>
                      <span className="text-amber-100/60">{ALL_UNITS[id].bld === "towncenter" ? "TCs" : ALL_UNITS[id].label}</span>
                    </span>
                  ))}
                </div>
                <div className="flex flex-wrap items-center gap-4 rounded-xl bg-black/35 px-4 py-2">
                  <span className="text-[11px] uppercase tracking-wide text-amber-100/40">vills needed</span>
                  {["food", "wood", "gold"].map((res) => {
                    const v = pcTotals[res];
                    if (!v) return null;
                    return (
                      <span key={res} className="flex items-baseline gap-1.5">
                        <Icon kind={res === "food" ? "food" : res === "wood" ? "woodres" : "goldres"} size={22} />
                        <span className="text-xl font-semibold tabular-nums" style={{ color: RES_C[res] }}>{Math.ceil(v)}</span>
                        <span className="text-[11px] uppercase text-amber-100/50">{res}</span>
                      </span>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}
      </div>


      {/* CIV PANEL — below the running action display */}
      <div className="flex justify-center">
        <button onClick={() => setCivsOpen(!civsOpen)}
          className="rounded-full border border-amber-900/70 bg-black/40 px-4 py-1 text-sm font-bold text-amber-200 hover:bg-amber-950/60">
          ⚔ Civilizations {civsOpen ? "▲" : "▼"}
        </button>
      </div>
      {civsOpen && (
        <div className="civ-panel rounded-2xl border border-amber-900/50 bg-black/30 px-3 py-2">
          {/* Row 1: me + friends — always visible while open */}
          <div className="flex flex-wrap justify-start gap-2 sm:gap-4">
            <CivBadge side="me" value={myCiv} active={picker === "me"}
              onOpen={() => setPicker(picker === "me" ? null : "me")} />
            {allies.map((a, k) => (
              <CivBadge key={k} side="ally" value={a} active={picker === "ally:" + k}
                onOpen={() => setPicker(picker === "ally:" + k ? null : "ally:" + k)} />
            ))}
          </div>
          {(picker === "me" || /^ally:\d+$/.test(picker)) && (
            <CivPicker color="#4a90d9" civs={BASE_CIV_LIST}
              value={picker === "me" ? myCiv : allies[Number(picker.slice(5))]}
              onSelect={(v) => {
                if (v === null) { setPicker(null); return; }
                if (picker === "me") setMyCiv(v);
                else setCivAt(allies, setAllies, Number(picker.slice(5)), v);
                setPicker(null);
              }} />
          )}
          {/* Row 2: enemies — always visible while open; AI may pick any civ incl. DLC */}
          <div className="mt-2 flex flex-wrap justify-center gap-2 border-t border-amber-900/40 pt-2 sm:gap-4">
            {enemies.map((e, k) => (
              <CivBadge key={k} side="enemy" value={e} active={picker === "enemy:" + k}
                onOpen={() => setPicker(picker === "enemy:" + k ? null : "enemy:" + k)} />
            ))}
          </div>
          {/^enemy:\d+$/.test(picker) && (
            <CivPicker color="#c05a5a" civs={ALL_CIV_LIST}
              value={enemies[Number(picker.slice(7))]}
              onSelect={(v) => { if (v !== null) setCivAt(enemies, setEnemies, Number(picker.slice(7)), v); setPicker(null); }} />
          )}
        </div>
      )}

      {/* Progression + controls */}
      <div className="mt-auto flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-3">
        <button onClick={prev} className="rounded-xl bg-black/50 px-5 py-2 text-xl hover:bg-black/70">◀</button>
        <div className="pills-scroll flex-1 overflow-x-auto">
          <div style={{ minWidth: "max-content" }}>
            {/* minute ruler on its own line above the pills panel: blue dots connected by a line */}
            <div className="relative mb-1 h-4">
              <div className="absolute left-0 right-0" style={{ top: 13, height: 1, backgroundColor: "rgba(74,144,217,0.55)" }} />
              {minuteMarks.map(({ m, pct }) => (
                <div key={m} className="absolute flex flex-col items-center" style={{ left: pct + "%", transform: "translateX(-50%)" }}>
                  <span className="text-[9px] font-bold leading-none" style={{ color: "#7db4e8" }}>{m}</span>
                  <span className="mt-[1px] h-1.5 w-1.5 rounded-full" style={{ backgroundColor: "#4a90d9" }} />
                </div>
              ))}
            </div>
            <div className="rounded-xl bg-black/30 p-1.5" style={{ display: "grid", gridTemplateColumns: `repeat(${steps.length}, minmax(56px, 1fr))`, gap: "4px" }}>
          {steps.map((s, idx) => {
            const vc = villCount(steps, idx);
            return (
              <button key={idx} onClick={() => setI(idx)}
                className="flex flex-col items-center rounded-lg px-1 py-0.5 text-[10px] leading-tight transition-all"
                style={{
                  backgroundColor: idx === i ? bo.accent + "33" : "transparent",
                  border: idx === i ? "1px solid " + bo.accent : "1px solid transparent",
                  opacity: idx > i + 2 ? 0.45 : 1,
                }}>
                <span className="font-mono font-bold" style={{ color: bo.accent }}>{s.t}</span>
                <span className="font-bold text-amber-200">{vc}&#129485;</span>
                <span className="max-w-[64px] truncate text-amber-100/70" title={stepDesc(s)}>{stepDesc(s)}</span>
              </button>
            );
          })}
            </div>
          </div>
        </div>
        <button onClick={next} disabled={i >= steps.length - 1}
          className="rounded-xl px-8 py-2 text-xl font-extrabold disabled:opacity-40"
          style={{ backgroundColor: bo.accent, color: "#14100a", minWidth: 120 }}>
          NEXT ▶ <span className="text-xs font-normal">(Space)</span>
        </button>
      </div>
    </div>
  );
}
import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
